<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#0B1220}
a{color:#A5B4FC}a:hover{color:#C7D2FE}

<div style="width: 100%; background: #0B1220; color: #F5F7FB">
<dc-import name="Header" hint-size="100%,124px"></dc-import>

<section style="padding: 80px 24px 104px; background-color: #0B1220; background-image: linear-gradient(#141D30 1px, transparent 1px), linear-gradient(90deg, #141D30 1px, transparent 1px); background-size: 56px 56px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 56px; align-items: flex-start">
<div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column; gap: 22px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: #A5B4FC">Contact</span>
<h1 style="margin: 0; font-size: clamp(38px, 4.8vw, 56px); line-height: 1.06; font-weight: 800">Tell us what you need.</h1>
<p style="margin: 0; font-size: 18px; line-height: 1.65; color: #A3ADC2">Send a few lines about your project. We reply within [1 business day] with next steps or a time for a call.</p>
<div style="display: flex; flex-direction: column; gap: 12px; margin-top: 8px">
<sc-for list="{{channels}}" as="c" hint-placeholder-count="4">
<a href="{{c.href}}" style="display: flex; gap: 16px; align-items: center; padding: 18px 20px; border-radius: 16px; border: 1px solid #1E2738; background: #121A2B; color: #F5F7FB; text-decoration: none">
<span style="flex: 0 0 44px; height: 44px; border-radius: 12px; background: #1B2340; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" sc-camel-view-box="0 0 24 24" fill="none" stroke="#A5B4FC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 16px">{{c.title}}</strong><span style="font-size: 14px; color: #A3ADC2">{{c.value}}</span></span>
</a>
</sc-for>
</div>
</div>
<form style="flex: 1 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 16px; padding: 36px; border-radius: 22px; background: #FFFFFF; color: #0B1220; box-shadow: 0 40px 80px rgba(0,0,0,0.4)">
