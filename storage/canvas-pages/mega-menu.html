<div style="width: 1440px; height: 640px; background: #0B1220; position: relative; overflow: hidden">
<dc-import name="Header" hint-size="1440px,124px"></dc-import>
<div style="position: absolute; top: 132px; left: 50%; transform: translateX(-50%); width: 1200px; display: flex; border-radius: 20px; background: #FFFFFF; color: #0B1220; box-shadow: 0 40px 80px rgba(0,0,0,0.45); overflow: hidden">
<div style="flex: 1; padding: 32px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 6px">
<strong style="font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #4B5568; padding: 0 10px 8px">{{g.title}}</strong>
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="5">
<a href="{{it.href}}" style="display: flex; gap: 12px; padding: 10px; border-radius: 12px; color: #0B1220; text-decoration: none; background: {{it.bg}}">
<span style="flex: 0 0 38px; height: 38px; border-radius: 10px; background: #EEF0FF; display: flex; align-items: center; justify-content: center"><svg width="19" height="19" sc-camel-view-box="0 0 24 24" fill="none" stroke="#4F46E5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">{{it.title}}</strong><span style="font-size: 13px; color: #4B5568">{{it.desc}}</span></span>
</a>
</sc-for>
</div>
</sc-for>
</div>
<div style="flex: 0 0 300px; background: #0B1220; color: #F5F7FB; padding: 28px; display: flex; flex-direction: column; gap: 16px">
<div style="aspect-ratio: 4 / 3; border-radius: 14px; border: 1.5px dashed #3A4660; background: #121A2B; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 16px; text-align: center; font-size: 13px; color: #A3ADC2">
<strong style="color: #F5F7FB">MENU-01</strong><span>Screenshot of an audit report page · 800×600</span>
</div>
<strong style="font-family: 'Plus Jakarta Sans', sans-serif; font-size: 20px">Free website &amp; systems audit</strong>
<span style="font-size: 14px; line-height: 1.55; color: #A3ADC2">A short report with screenshots: what's broken and what to fix first.</span>
<a href="/free-audit" style="margin-top: auto; text-align: center; padding: 12px 16px; border-radius: 10px; background: #6366F1; color: #FFFFFF; font-weight: 600; text-decoration: none">Get my audit</a>
