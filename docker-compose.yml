services:
  postgres:
    image: postgres:16-alpine
    container_name: sales-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salesplatform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salesplatform_secret}
      POSTGRES_DB: ${POSTGRES_DB:-sales_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salesplatform} -d ${POSTGRES_DB:-sales_platform}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sales-platform-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - with-redis

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sales-platform-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-salesplatform}:${POSTGRES_PASSWORD:-salesplatform_secret}@postgres:5432/${POSTGRES_DB:-sales_platform}?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
